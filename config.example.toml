# agent-relay-mcp configuration. Copy to ~/.config/agent-relay-mcp/config.toml.
# Every key is optional; the values below are the defaults unless noted.

# The endpoint. Keep it on loopback: the internet reaches it only through a
# TLS reverse proxy that forwards a secret path (see README "Exposing it").
listen_host = "127.0.0.1"
listen_port = 8765
path = "/mcp"

# Public host name(s) the reverse proxy forwards with. Requests with any other
# Host header are refused (421), as a guard against DNS rebinding.
# No default; for example:
# public_hosts = ["example.org"]

# Every direct subdirectory of this folder is a project.
projects_dir = "~/Projects"

# Projects without .devcontainer/devcontainer.json are refused unless this is
# on; then Claude Code runs for them directly on this machine, as you.
allow_host_projects = false

# How a stopped dev container is started. "{project}" becomes the project's
# absolute path. The default needs the dev container CLI
# (npm install -g @devcontainers/cli). Use an absolute path: a systemd user
# service does not see the PATH of your login shell.
start_command = ["devcontainer", "up", "--workspace-folder", "{project}"]
start_timeout = 600

# How Claude Code is run. Each message is one `claude -p` run, continuing the
# project's conversation with --resume. Claude Code must be installed and
# signed in where it runs (in the container: for example with a token from
# `claude setup-token` in CLAUDE_CODE_OAUTH_TOKEN).
claude_command = "claude"
permission_mode = "auto"      # nobody is there to answer permission prompts
model = ""                    # empty: Claude Code's default
# append_system_prompt = "..."  # default: tells Claude Code that its reply is relayed
extra_args = []

# Longest wait a tool call may ask for, in seconds. Claude's apps give up on a
# tool call somewhere between 20 and 60 seconds.
max_wait_seconds = 15

# What this instance is called in the tool texts, e.g. "Laptop"; empty: not
# mentioned.
instance_name = ""

# Approvals. Every project is locked; a message to it waits for approval at
# the laptop. A grant ends after grant_idle_minutes without a message or a
# running request; an unanswered request is dropped after
# request_expiry_minutes. Upper limits per grant: one project, all projects,
# and anything with full access to this computer (projects without a dev
# container, or a project run on the host instead of its dev container).
grant_idle_minutes = 30
request_expiry_minutes = 30
max_grant_hours = 12
max_all_grant_hours = 4
max_host_grant_hours = 2
