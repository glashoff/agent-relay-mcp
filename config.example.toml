# agent-relay-mcp configuration. Copy to ~/.config/agent-relay-mcp/config.toml.
# Every key is optional; the values below are the defaults unless noted.

# The endpoint. Keep it on loopback: the internet reaches it only through a
# TLS reverse proxy that forwards a secret path (see README "Exposing it").
listen_host = "127.0.0.1"
listen_port = 8765
path = "/mcp"

# Public host name(s) the reverse proxy forwards with. Requests with any other
# Host header are refused (421), as a guard against DNS rebinding.
# No default; for example:
# public_hosts = ["example.org"]

# Unix sockets, for clients on this machine without a TCP path to the relay
# (the voice service in its container). Both off (empty) by default; "~" and
# $XDG_RUNTIME_DIR are expanded. The relay creates the directory with mode
# 700 if it is missing, the sockets with mode 600, replaces a stale socket
# file and removes the sockets when it stops.
# mcp_socket: the same MCP endpoint as above (same Host and Origin checks:
# clients send "Host: localhost:8765"), in addition to the TCP port.
# events_socket: every control event (run started or ended, request added,
# ...) as one JSON object per line, the same JSON as the D-Bus signal Event.
# Read-only: nothing sent to it is read. Recommended values:
# mcp_socket = "$XDG_RUNTIME_DIR/agent-relay/mcp.sock"
# events_socket = "$XDG_RUNTIME_DIR/agent-relay/events.sock"
mcp_socket = ""
events_socket = ""

# Every direct subdirectory of this folder is a project.
projects_dir = "~/Projects"

# Projects without .devcontainer/devcontainer.json are refused unless this is
# on; then Claude Code runs for them directly on this machine, as you.
allow_host_projects = false

# How a stopped dev container is started. "{project}" becomes the project's
# absolute path. The default needs the dev container CLI
# (npm install -g @devcontainers/cli). Use an absolute path: a systemd user
# service does not see the PATH of your login shell.
start_command = ["devcontainer", "up", "--workspace-folder", "{project}"]
start_timeout = 600

# How Claude Code is run: one `claude -p` run per conversation, kept open
# between messages (see conversation_idle_minutes); a new run continues the
# project's conversation with --resume. Claude Code must be installed and
# signed in where it runs (in the container: for example with a token from
# `claude setup-token` in CLAUDE_CODE_OAUTH_TOKEN).
claude_command = "claude"
permission_mode = "auto"      # nobody is there to answer permission prompts
model = ""                    # empty: Claude Code's default
# append_system_prompt = "..."  # default: tells Claude Code that its reply is relayed
extra_args = []

# Claude Code stays open in a project's conversation after a request, so the
# next message goes straight in and background tasks (subagents, long
# commands) can finish. Its run is closed after this many minutes with no
# message and no background task open (also when the approval ends, on stop,
# release, a switch between dev container and host, or a new conversation);
# the next message then resumes the conversation in a new run. While a run is
# open, a `claude` process runs in the dev container, which keeps an idle-stop
# of the container from stopping it until then. 0: close right after each
# request.
conversation_idle_minutes = 15

# Longest wait a tool call may ask for, in seconds. Claude's apps give up on a
# tool call somewhere between 20 and 60 seconds.
max_wait_seconds = 15

# What this instance is called in the tool texts, e.g. "Laptop"; empty: not
# mentioned.
instance_name = ""

# Approvals. Every project is locked; a message to it waits for approval at
# the laptop. A grant ends after grant_idle_minutes without a message or a
# running request; an unanswered request is dropped after
# request_expiry_minutes. Upper limits per grant: one project, all projects,
# and anything with full access to this computer (projects without a dev
# container, or a project run on the host instead of its dev container).
grant_idle_minutes = 30
request_expiry_minutes = 30
max_grant_hours = 12
max_all_grant_hours = 4
max_host_grant_hours = 2

# Offer grants and approvals on the D-Bus session bus, for the GNOME extension
# and agent-relay-ctl. Needs the "desktop" extra (dbus-fast); without it,
# nothing can be approved.
control_dbus = true

# Keeps the computer awake while Claude Code works (mode set in the GNOME menu
# or with agent-relay-ctl keep-awake); empty: never.
keep_awake_command = "systemd-inhibit"

# A readable log of each project's conversation in the project folder,
# .relay/log.md (git ignores it through .relay/.gitignore): what was sent,
# Claude Code's steps, thinking and replies, written as they come. Open it in
# VS Code with the Markdown preview to follow along.
project_log = true
# Thinking as short summaries (in the log), "omitted", or "" for Claude Code's
# default (no thinking text in this mode).
thinking_display = "summarized"
